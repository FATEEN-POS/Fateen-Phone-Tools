<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Tools - كاميرا الموبايل</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%230E0E0E%22/%3E%3Cpath%20d%3D%22M24.92%2C17.00%20L65.84%2C17.00%20L65.84%2C32.84%20L40.76%2C32.84%20L40.76%2C42.08%20L57.92%2C42.08%20L57.92%2C57.92%20L40.76%2C57.92%20L40.76%2C83.00%20L24.92%2C83.00%20Z%22%20fill%3D%22%23F2EFE8%22/%3E%3Ccircle%20cx%3D%2267.16%22%20cy%3D%2250.00%22%20r%3D%226.27%22%20fill%3D%22%23FF4F1F%22/%3E%3C/svg%3E">
<style>body{margin:0;background:#0E0E0E;color:#F2EFE8;font:16px "IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",Tahoma,sans-serif}video{width:100vw;height:calc(100vh - 52px);object-fit:contain;background:#0E0E0E}
#bar{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0E0E0E}button{background:#171717;color:inherit;border:1px solid #2A2A28;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}</style></head>
<body><video id="v" autoplay playsinline muted></video>
<div id="bar"><span id="st">في انتظار الموبايل...</span><button id="snd">تشغيل الصوت</button></div>
<script>
const v = document.getElementById('v'), st = document.getElementById('st');
const ws = new WebSocket(`wss://${location.host}/ws-pc`); let pc, q = Promise.resolve();
const out = o => ws.send(JSON.stringify(o));
async function handle(e) {
  const d = JSON.parse(e.data).rtc; if (!d) return;
  if (d.type === 'offer') {
    if (pc) pc.close(); pc = new RTCPeerConnection({ iceServers: [] });
    pc.ontrack = t => { v.srcObject = t.streams[0]; };
    pc.onicecandidate = c => c.candidate && out({ type: 'ice', candidate: c.candidate });
    await pc.setRemoteDescription({ type: 'offer', sdp: d.sdp });
    const a = await pc.createAnswer(); await pc.setLocalDescription(a); out({ type: 'answer', sdp: a.sdp }); st.textContent = 'متصل';
  } else if (d.type === 'ice' && pc) pc.addIceCandidate(d.candidate).catch(() => {});
  else if (d.type === 'bye') { if (pc) pc.close(); v.srcObject = null; st.textContent = 'الموبايل قفل الكاميرا'; }
}
ws.onmessage = e => { q = q.then(() => handle(e)); };
ws.onclose = () => { st.textContent = 'انقطع الاتصال بالسيرفر'; };
document.getElementById('snd').onclick = () => { v.muted = !v.muted; };
</script></body></html>
